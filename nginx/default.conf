server {
    listen 80;
    root /srv/app;
    index index.html;

    location /files/ {
        alias /srv/files/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
